name: SMLM
scale: 1.0e-09
PSF:
  source: generate
  resolution:  # in nanometers, as standard deviations
    X: 8
    Y: 8
    Z: 8
  voxelsize: 2
depth: 100  # in nanometers
detector:
  FOV_size: # in nanometers. Default unless changed 
    X: 1000
    Y: 1000
  pixelsize: 2 # in nanometers
  noise: 
    binomial: 1
    gaussian:
      mean: 0
      standard_dev: 0
    gain: 1 
    baselevel:
      mean: 0
      standard_dev: 0
    ADU: 1
emitters:
  lateral_precision: 5  # in nanometers, used when precision_model is fixed
  axial_precision: 5  # in nanometers, used when precision_model is fixed
  nlocalisations: 5
  # localisations are not convolved with the PSF above; they are rendered
  # with a lateral Gaussian of this standard deviation (0 = histogram)
  rendering_kernel_nm: 0
  # fixed: use lateral_precision and axial_precision
  # photon_limited: derive the precision from the photons per localisation
  # (fluorophore photons per second x exposure time), Mortensen et al. 2010
  precision_model: fixed
  # parameters for photon_limited
  detection_psf_sigma_nm: 100  # ~0.21 x wavelength / NA
  camera_pixelsize_nm: 100  # camera pixel size in sample space
  background_photons: 10  # per camera pixel
  excess_noise_factor: 1  # 1 for sCMOS, 2 for EMCCD
  axial_precision_ratio: 2.5  # axial / lateral precision
  
    # no value is only poisson noise. Expected order of values
    # p (binomial), mean, standard deviation (gaussian), gain (gamma), mean, standard deviation (abaselevel), adu (conversion factor) 