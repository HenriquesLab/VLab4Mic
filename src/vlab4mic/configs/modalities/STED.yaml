name: STED
scale: 1.0e-09
PSF:
  source: generate
  resolution:  # in nanometers, as standard deviations
    X: 20
    Y: 20
    Z: 300  # 2D STED: depletion is lateral only, axial width is confocal-like
  voxelsize: 5
depth: 100  # in nanometers
detector:
  # true: point-scanning; exposure time is the pixel dwell time
  scanning: false
  FOV_size: # in nanometers. Default unless changed 
    X: 1000
    Y: 1000
  pixelsize: 15 # in nanometers
  noise: 
    binomial: 1
    gaussian:
      mean: 0
      standard_dev: 1
    gain: 1 
    em_gain: false  # true: EMCCD gamma-distributed gain (excess noise factor 2)
    baselevel:
      mean: 0
      standard_dev: 1
    ADU: 1
  
  
    # no value is only poisson noise. Expected order of values
    # p (binomial), mean, standard deviation (gaussian), gain (gamma), mean, standard deviation (abaselevel), adu (conversion factor) 